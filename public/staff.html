<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff - Blokart kalender · Club Fanø</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/staff.css" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="https://clubfanoe.dk/wp-content/uploads/2024/04/CLub-fanoe-logo-hvid.png" alt="Club Fanø" />
    <div class="title" data-t="navTitle">Personale · Blokart kalender</div>
    <div class="spacer"></div>
    <span class="refresh-meta" id="liveMeta"></span>
    <div class="langbar" style="margin-left:12px;">
      <button data-lang="da">DA</button>
      <button data-lang="en">EN</button>
    </div>
  </header>

  <div class="wrap" style="max-width:1040px;">

    <!-- Login -->
    <div class="card" id="loginCard">
      <h2 data-t="login">Log ind</h2>
      <label for="code" data-t="staffCode">Personale-kode</label>
      <input type="password" id="code" style="max-width:280px;" />
      <div id="loginMsg"></div>
      <button class="btn btn-secondary" id="loginBtn" style="margin-top:12px;" data-t="login">Log ind</button>
    </div>

    <div id="app" style="display:none;">
      <div class="card">
        <div class="toolbar">
          <button class="btn-ghost btn" id="prevDay" data-t="yesterday">◀ I går</button>
          <input type="date" id="day" style="max-width:190px;" />
          <button class="btn-ghost btn" id="nextDay" data-t="tomorrow">I morgen ▶</button>
          <div class="spacer"></div>
          <button class="btn btn-secondary" id="refreshBtn" data-t="refreshNow">Opdatér nu</button>
        </div>
        <div id="closureArea" style="margin-top:14px;"></div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2 style="margin-bottom:6px;" data-t="availTitle">Ledige vogne i løbet af dagen</h2>
          <div class="hint" data-t="availHint">Opdateres automatisk hvert 10. minut, så I aldrig overbooker.</div>
          <div id="calTable"></div>
        </div>

        <div class="card">
          <h2 style="margin-bottom:6px;" data-t="bookingsTitle">Dagens bookinger</h2>
          <div id="bookingList"></div>
        </div>
      </div>

      <div class="card">
        <h2 data-t="createTitle">Opret booking i butikken</h2>
        <div class="hint" data-t="createHint">Når I opretter her, opdateres vognregnskabet med det samme - både her og online.</div>
        <div class="row">
          <div><label data-t="singleQtyLabel">Antal single</label><input type="number" id="sSingle" min="0" max="10" value="0" /></div>
          <div><label data-t="doubleQtyLabel">Antal dobbelt</label><input type="number" id="sDouble" min="0" max="3" value="0" /></div>
        </div>
        <div class="row">
          <div><label data-t="duration">Varighed</label><select id="sDur"></select></div>
          <div><label data-t="time">Tid (HH:MM)</label><input id="sTime" placeholder="13:00" /></div>
        </div>
        <div class="row">
          <div><label data-t="name">Navn</label><input id="sName" /></div>
          <div><label><span data-t="phone">Telefon</span> <span class="req">*</span></label><input id="sPhone" placeholder="12 34 56 78" /></div>
        </div>
        <div class="row">
          <div><label data-t="note">Note (valgfri)</label><input id="sNote" /></div>
          <div></div>
        </div>
        <div id="createMsg"></div>
        <button class="btn" id="createBtn" style="margin-top:14px;" data-t="createBtn">Opret booking</button>
      </div>
    </div>
  </div>

  <script src="/staff.translations.js"></script>
  <script src="/staff.js"></script>
</body>
</html>
