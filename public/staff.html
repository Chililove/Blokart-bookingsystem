<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff - Blokart kalender · Club Fanø</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .toolbar .spacer { flex:1; }
    table.cal { width:100%; border-collapse:collapse; margin-top:8px; }
    table.cal th, table.cal td { border:1px solid var(--line); padding:8px 10px; text-align:left; font-size:.92rem; }
    table.cal th { background:#f0f5f6; color:var(--sea); }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.78rem; font-weight:700; }
    .pill.single { background:#e3f1f4; color:#0e4d64; }
    .pill.double { background:#fdeadf; color:#9a4a1d; }
    .pill.online { background:#eef0f2; color:#555; }
    .pill.staff  { background:#e8f6ee; color:#2f7d55; }
    .free-good { color:var(--ok); font-weight:700; }
    .free-zero { color:var(--bad); font-weight:700; }
    .refresh-meta { font-size:.8rem; color:var(--muted); }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    @media (max-width:760px){ .grid2 { grid-template-columns:1fr; } }
    .xbtn { background:none;border:none;color:var(--bad);cursor:pointer;font-weight:700; }
    .tip { position:relative; display:inline-block; cursor:help; color:var(--bad); font-weight:700; margin-left:2px; }
    .tip .tip-text {
      visibility:hidden; opacity:0; transition:opacity .15s;
      position:absolute; bottom:135%; left:50%; transform:translateX(-50%);
      width:250px; background:#21303a; color:#fff; text-align:left;
      padding:9px 11px; border-radius:8px; font-size:.8rem; font-weight:500; line-height:1.45;
      box-shadow:0 6px 18px rgba(0,0,0,.22); z-index:20;
    }
    .tip .tip-text::after { content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:6px solid transparent; border-top-color:#21303a; }
    .tip:hover .tip-text, .tip:focus .tip-text { visibility:visible; opacity:1; }
    .langbar { display:flex; gap:6px; }
    .langbar button {
      background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4);
      border-radius:6px; padding:4px 9px; font-weight:700; cursor:pointer; font-size:.85rem;
    }
    .langbar button.active { background:#fff; color:var(--sea); }
  </style>
</head>
<body>
  <header class="topbar">
    <img class="logo" src="https://clubfanoe.dk/wp-content/uploads/2024/04/CLub-fanoe-logo-hvid.png" alt="Club Fanø" />
    <div class="title" data-t="navTitle">Personale · Blokart kalender</div>
    <div class="spacer"></div>
    <span class="refresh-meta" id="liveMeta"></span>
    <div class="langbar" style="margin-left:12px;">
      <button data-lang="da">DA</button>
      <button data-lang="en">EN</button>
    </div>
  </header>

  <div class="wrap" style="max-width:1040px;">

    <!-- Login -->
    <div class="card" id="loginCard">
      <h2 data-t="login">Log ind</h2>
      <label for="code" data-t="staffCode">Personale-kode</label>
      <input type="password" id="code" style="max-width:280px;" />
      <div id="loginMsg"></div>
      <button class="btn btn-secondary" id="loginBtn" style="margin-top:12px;" data-t="login">Log ind</button>
    </div>

    <div id="app" style="display:none;">
      <div class="card">
        <div class="toolbar">
          <button class="btn-ghost btn" id="prevDay" data-t="yesterday">◀ I går</button>
          <input type="date" id="day" style="max-width:190px;" />
          <button class="btn-ghost btn" id="nextDay" data-t="tomorrow">I morgen ▶</button>
          <div class="spacer"></div>
          <button class="btn btn-secondary" id="refreshBtn" data-t="refreshNow">Opdatér nu</button>
        </div>
        <div id="closureArea" style="margin-top:14px;"></div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2 style="margin-bottom:6px;" data-t="availTitle">Ledige vogne i løbet af dagen</h2>
          <div class="hint" data-t="availHint">Opdateres automatisk hvert 10. minut, så I aldrig overbooker.</div>
          <div id="calTable"></div>
        </div>

        <div class="card">
          <h2 style="margin-bottom:6px;" data-t="bookingsTitle">Dagens bookinger</h2>
          <div id="bookingList"></div>
        </div>
      </div>

      <div class="card">
        <h2 data-t="createTitle">Opret booking i butikken</h2>
        <div class="hint" data-t="createHint">Når I opretter her, opdateres vognregnskabet med det samme - både her og online.</div>
        <div class="row">
          <div><label data-t="singleQtyLabel">Antal single</label><input type="number" id="sSingle" min="0" max="10" value="0" /></div>
          <div><label data-t="doubleQtyLabel">Antal dobbelt</label><input type="number" id="sDouble" min="0" max="3" value="0" /></div>
        </div>
        <div class="row">
          <div><label data-t="duration">Varighed</label><select id="sDur"></select></div>
          <div><label data-t="time">Tid (HH:MM)</label><input id="sTime" placeholder="13:00" /></div>
        </div>
        <div class="row">
          <div><label data-t="name">Navn</label><input id="sName" /></div>
          <div><label><span data-t="phone">Telefon</span> <span class="req">*</span></label><input id="sPhone" placeholder="12 34 56 78" /></div>
        </div>
        <div class="row">
          <div><label data-t="note">Note (valgfri)</label><input id="sNote" /></div>
          <div></div>
        </div>
        <div id="createMsg"></div>
        <button class="btn" id="createBtn" style="margin-top:14px;" data-t="createBtn">Opret booking</button>
      </div>
    </div>
  </div>

<script>
// Translations (Danish / English)
const S = {
  da: {
    navTitle:'Personale · Blokart kalender',
    login:'Log ind', staffCode:'Personale-kode', wrongCode:'Forkert kode.',
    yesterday:'◀ I går', tomorrow:'I morgen ▶', refreshNow:'Opdatér nu',
    availTitle:'Ledige vogne i løbet af dagen',
    availHint:'Opdateres automatisk hvert 10. minut, så I aldrig overbooker.',
    bookingsTitle:'Dagens bookinger',
    createTitle:'Opret booking i butikken',
    createHint:'Når I opretter her, opdateres vognregnskabet med det samme - både her og online.',
    cart:'Vogn', optSingle:'Single', optDouble:'Dobbeltsæde', duration:'Varighed',
    time:'Tid (HH:MM)', name:'Navn', phone:'Telefon', note:'Note (valgfri)', createBtn:'Opret booking',
    live:(m,s)=>`🟢 Live · næste auto-opdatering om ${m}:${s}`,
    closedBanner:(r)=>`🚫 <strong>Lukket for online booking denne dag</strong> - årsag: “${r}”. Kunder kan ikke booke i dag, men I kan stadig oprette bookinger manuelt.`,
    reopen:'Åbn dagen igen',
    closeLabel:'Luk denne dag (dårligt vejr):',
    reasonPh:'fx for meget vind / torden / for lidt vind',
    closeBtn:'Luk dagen',
    cancelAllLabel:'Aflys også alle bookinger denne dag og giv kunderne besked (SMS + e-mail)',
    cancelAllTip:'Sæt kun flueben hvis I er sikre - aflyste bookinger kan ikke føres tilbage, hvis dagen åbnes igen.',
    closeHint:'Er I i tvivl om vejret holder? Lad fluebenet være tomt - så stoppes kun nye bookinger, mens de eksisterende lever videre. Kunder kan stadig booke andre dage. Årsagen vises i kalenderen.',
    needReason:'Skriv en årsag (fx for meget vind).',
    confirmCancelAll:'Aflys ALLE bookinger denne dag og send besked til kunderne?',
    closedDone:(n)=>`Dagen er lukket. ${n} booking(er) aflyst, og kunderne har fået besked.`,
    colTime:'Tid', colSingleFree:'Single fri', colDoubleFree:'Dobbelt fri',
    noBookings:'Ingen bookinger denne dag endnu.',
    colCart:'Vogn', colCustomer:'Kunde', colSource:'Kilde',
    double:'Dobbelt', single:'Single', awaiting:'afventer betaling',
    shop:'Butik', online:'Online', cancel:'Aflys',
    cancelPrompt:'Aflys booking. Skriv en årsag (sendes til kunden på SMS/e-mail):',
    cancelDefault:'for dårligt vejr',
    created:(id)=>`✔ Booking #${id} oprettet.`,
    singleQtyLabel:'Antal single', doubleQtyLabel:'Antal dobbelt',
    createdN:(n)=>`✔ Booking oprettet (${n} vogn${n===1?'':'e'}).`,
    hUnit:'t',
  },
  en: {
    navTitle:'Staff · Blokart calendar',
    login:'Log in', staffCode:'Staff code', wrongCode:'Wrong code.',
    yesterday:'◀ Yesterday', tomorrow:'Tomorrow ▶', refreshNow:'Refresh now',
    availTitle:'Available carts during the day',
    availHint:'Updates automatically every 10 minutes, so you never overbook.',
    bookingsTitle:'Bookings today',
    createTitle:'Create booking in the shop',
    createHint:'When you create here, the cart count updates instantly - both here and online.',
    cart:'Cart', optSingle:'Single', optDouble:'Two-seater', duration:'Duration',
    time:'Time (HH:MM)', name:'Name', phone:'Phone', note:'Note (optional)', createBtn:'Create booking',
    live:(m,s)=>`🟢 Live · next auto-refresh in ${m}:${s}`,
    closedBanner:(r)=>`🚫 <strong>Closed for online booking this day</strong> - reason: “${r}”. Customers cannot book today, but you can still create bookings manually.`,
    reopen:'Reopen the day',
    closeLabel:'Close this day (bad weather):',
    reasonPh:'e.g. too much wind / thunder / too little wind',
    closeBtn:'Close the day',
    cancelAllLabel:'Also cancel all bookings this day and notify customers (SMS + email)',
    cancelAllTip:'Only tick this if you are sure - cancelled bookings cannot be restored if the day is reopened.',
    closeHint:'Not sure the weather will hold? Leave the box unticked - then only new bookings are stopped, while existing ones stay. Customers can still book other days. The reason is shown in the calendar.',
    needReason:'Enter a reason (e.g. too much wind).',
    confirmCancelAll:'Cancel ALL bookings this day and notify the customers?',
    closedDone:(n)=>`The day is closed. ${n} booking(s) cancelled and customers notified.`,
    colTime:'Time', colSingleFree:'Single free', colDoubleFree:'Double free',
    noBookings:'No bookings this day yet.',
    colCart:'Cart', colCustomer:'Customer', colSource:'Source',
    double:'Double', single:'Single', awaiting:'awaiting payment',
    shop:'Shop', online:'Online', cancel:'Cancel',
    cancelPrompt:'Cancel booking. Enter a reason (sent to the customer by SMS/email):',
    cancelDefault:'due to bad weather',
    created:(id)=>`✔ Booking #${id} created.`,
    singleQtyLabel:'Number of single', doubleQtyLabel:'Number of double',
    createdN:(n)=>`✔ Booking created (${n} cart${n===1?'':'s'}).`,
    hUnit:'h',
  },
};

let LANG = 'da';
try { const saved = localStorage.getItem('staffLang'); if (saved && S[saved]) LANG = saved; } catch (e) {}
function tr() { return S[LANG]; }

function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = tr()[el.dataset.t];
    if (typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('.langbar button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
  if (CFG) { buildDurations(); refresh(); } // re-render dynamic parts in new language
}

document.querySelectorAll('.langbar button').forEach(b => b.addEventListener('click', () => {
  LANG = b.dataset.lang;
  try { localStorage.setItem('staffLang', LANG); } catch (e) {}
  applyLang();
}));

let CODE = null, CFG = null, currentDay = null, pollTimer = null, countdownTimer = null, nextPoll = 0;
function authHeaders(extra={}) { return Object.assign({ 'x-staff-code': CODE, 'Content-Type':'application/json' }, extra); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function buildDurations() {
  const dur = document.getElementById('sDur');
  const cur = dur.value;
  dur.innerHTML = '';
  CFG.durationsMinutes.forEach(m => { const o=document.createElement('option'); o.value=m; o.textContent=(m/60)+' '+tr().hUnit; dur.appendChild(o); });
  if (cur) dur.value = cur;
}

// Login
document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('code').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
async function login() {
  CODE = document.getElementById('code').value;
  const res = await fetch('/api/bookings/list?from=0&to=1', { headers: authHeaders() });
  if (res.status === 401) { document.getElementById('loginMsg').innerHTML = `<div class="notice bad">${tr().wrongCode}</div>`; return; }
  CFG = await (await fetch('/api/config')).json();
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  buildDurations();
  currentDay = todayStr();
  document.getElementById('day').value = currentDay;
  startPolling();
  refresh();
}

// Auto-refresh every 10 min
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refresh, CFG.pollIntervalMs);
  nextPoll = Date.now() + CFG.pollIntervalMs;
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    const s = Math.max(0, Math.round((nextPoll - Date.now())/1000));
    const m = Math.floor(s/60), ss = String(s%60).padStart(2,'0');
    document.getElementById('liveMeta').textContent = tr().live(m, ss);
  }, 1000);
}

document.getElementById('refreshBtn').addEventListener('click', () => { nextPoll = Date.now()+CFG.pollIntervalMs; refresh(); });
document.getElementById('prevDay').addEventListener('click', () => { currentDay = shiftDay(-1); document.getElementById('day').value = currentDay; refresh(); });
document.getElementById('nextDay').addEventListener('click', () => { currentDay = shiftDay(1); document.getElementById('day').value = currentDay; refresh(); });
document.getElementById('day').addEventListener('change', e => { currentDay = e.target.value; refresh(); });
function shiftDay(n){ const d=new Date(currentDay+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

// Fetch and render
async function refresh() {
  if (!CFG) return;
  nextPoll = Date.now() + CFG.pollIntervalMs;
  const from = new Date(currentDay+'T00:00:00').getTime();
  const to   = new Date(currentDay+'T23:59:59').getTime();
  const [listRes, slotsRes] = await Promise.all([
    fetch(`/api/bookings/list?from=${from}&to=${to}`, { headers: authHeaders() }),
    fetch(`/api/slots?date=${currentDay}&durationMinutes=${CFG.durationsMinutes[0]}`)
  ]);
  const list = await listRes.json();
  const slots = await slotsRes.json();
  renderClosure(list.closures, slots.closure);
  renderCal(slots);
  renderBookings(list.bookings);
}

function renderClosure(closures, closure) {
  const area = document.getElementById('closureArea');
  if (closure) {
    area.innerHTML = `<div class="closed-banner">${tr().closedBanner(closure.reason)}
      <button class="btn btn-ghost" id="openDay" style="margin-left:10px;padding:6px 16px;">${tr().reopen}</button></div>`;
    document.getElementById('openDay').addEventListener('click', async () => {
      await fetch('/api/closures', { method:'DELETE', headers: authHeaders(), body: JSON.stringify({ date: currentDay }) });
      refresh();
    });
  } else {
    area.innerHTML = `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <strong>${tr().closeLabel}</strong>
      <input id="reason" placeholder="${tr().reasonPh}" style="flex:1;min-width:220px;" />
      <button class="btn" id="closeDay" style="padding:9px 18px;">${tr().closeBtn}</button></div>
      <label style="font-weight:normal;margin-top:8px;display:flex;gap:8px;align-items:center;">
        <input type="checkbox" id="cancelExisting" style="width:auto;" />
        <span>${tr().cancelAllLabel}<span class="tip" tabindex="0">⚠<span class="tip-text">${tr().cancelAllTip}</span></span></span>
      </label>
      <div class="hint">${tr().closeHint}</div>`;
    document.getElementById('closeDay').addEventListener('click', async () => {
      const reason = document.getElementById('reason').value.trim();
      if (!reason) { alert(tr().needReason); return; }
      const cancelExisting = document.getElementById('cancelExisting').checked;
      if (cancelExisting && !confirm(tr().confirmCancelAll)) return;
      const r = await (await fetch('/api/closures', { method:'POST', headers: authHeaders(), body: JSON.stringify({ date: currentDay, reason, cancelExisting }) })).json();
      if (r.cancelledCount) alert(tr().closedDone(r.cancelledCount));
      refresh();
    });
  }
}

function renderCal(slots) {
  let html = `<table class="cal"><tr><th>${tr().colTime}</th><th>${tr().colSingleFree}</th><th>${tr().colDoubleFree}</th></tr>`;
  slots.slots.forEach(s => {
    const sc = s.singleAvailable < 1 ? 'free-zero' : 'free-good';
    const dc = s.doubleAvailable < 1 ? 'free-zero' : 'free-good';
    html += `<tr><td>${s.time}</td><td class="${sc}">${s.singleAvailable} / ${CFG.fleet.totalSingle}</td><td class="${dc}">${s.doubleAvailable} / ${CFG.fleet.permanentDouble + CFG.fleet.convertibleDouble}</td></tr>`;
  });
  html += '</table>';
  document.getElementById('calTable').innerHTML = html;
}

function renderBookings(bookings) {
  const el = document.getElementById('bookingList');
  if (!bookings.length) { el.innerHTML = `<p class="hint">${tr().noBookings}</p>`; return; }
  bookings.sort((a,b)=>a.start-b.start);
  let html = `<table class="cal"><tr><th>${tr().colTime}</th><th>${tr().colCart}</th><th>${tr().colCustomer}</th><th>${tr().colSource}</th><th></th></tr>`;
  bookings.forEach(b => {
    const t = new Date(b.start), e = new Date(b.end);
    const hhmm = d => String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    const statusTxt = b.status === 'pending_payment' ? ` <span class="pill online">${tr().awaiting}</span>` : '';
    html += `<tr>
      <td>${hhmm(t)}–${hhmm(e)}</td>
      <td><span class="pill ${b.type}">${b.type==='double'?tr().double:tr().single}</span></td>
      <td>${b.name}<br><a href="tel:${b.phone}">${b.phone}</a>${statusTxt}</td>
      <td><span class="pill ${b.source}">${b.source==='staff'?tr().shop:tr().online}</span></td>
      <td><button class="xbtn" data-id="${b.id}">${tr().cancel}</button></td>
    </tr>`;
  });
  html += '</table>';
  el.innerHTML = html;
  el.querySelectorAll('.xbtn').forEach(btn => btn.addEventListener('click', async () => {
    const reason = prompt(tr().cancelPrompt, tr().cancelDefault);
    if (reason === null) return;
    await fetch('/api/bookings/cancel', { method:'POST', headers: authHeaders(), body: JSON.stringify({ id: Number(btn.dataset.id), reason }) });
    refresh();
  }));
}

// Create booking
document.getElementById('createBtn').addEventListener('click', async () => {
  const payload = {
    singleQty: Number(document.getElementById('sSingle').value) || 0,
    doubleQty: Number(document.getElementById('sDouble').value) || 0,
    date: currentDay,
    startTime: document.getElementById('sTime').value.trim(),
    durationMinutes: Number(document.getElementById('sDur').value),
    name: document.getElementById('sName').value,
    phone: document.getElementById('sPhone').value,
    note: document.getElementById('sNote').value,
    payment: 'shop',
  };
  const res = await fetch('/api/staff/bookings', { method:'POST', headers: authHeaders(), body: JSON.stringify(payload) });
  const data = await res.json();
  const msg = document.getElementById('createMsg');
  if (data.ok) {
    const n = data.bookings ? data.bookings.length : 1;
    msg.innerHTML = `<div class="notice ok">${tr().createdN(n)}</div>`;
    ['sSingle','sDouble'].forEach(id => document.getElementById(id).value = '0');
    ['sTime','sName','sPhone','sNote'].forEach(id => document.getElementById(id).value = '');
    refresh();
  } else {
    msg.innerHTML = `<div class="notice bad">${data.error}</div>`;
  }
});

applyLang(); // localize static text on load
</script>
</body>
</html>
